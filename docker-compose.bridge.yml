# 备用网络：bridge + 单独暴露端口
#
# 默认 docker-compose.yml 用 host 网络。只有在 host 不能用时才叠加本文件：
#   docker compose -f docker-compose.yml -f docker-compose.bridge.yml up -d
#
# 注意：
#   1. config.yaml 的 server.public_url 必须改成 http://<Docker宿主机局域网IP>:8765
#      否则设备会拿到容器内网地址，下载不到音频。
#   2. bridge 下 UDP 8766 广播通常过不了，设备端建议手动填服务器 IP:8765。
services:
  xiaodu-brain:
    network_mode: bridge
    ports:
      - "8765:8765"
      - "8766:8766/udp"
